<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.22)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0)" />
    </radialGradient>

    <style>
      @keyframes flowWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatPill1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatPill2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseDot {
        0%, 100% { r: 3; opacity: 0.6; }
        50% { r: 5; opacity: 1; }
      }

      .pulse-bg-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 240px 120px; }
      .pulse-bg-2 { animation: pulseOrb 10s ease-in-out infinite alternate 2s; transform-origin: 960px 280px; }
      .flow-line { stroke-dasharray: 12, 12; animation: flowWave 12s linear infinite; }
      .flow-line-fast { stroke-dasharray: 8, 8; animation: flowWave 6s linear infinite reverse; }
      .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
      .pill-2 { animation: floatPill2 6s ease-in-out infinite 0.5s; }
      .pill-3 { animation: floatPill1 5.5s ease-in-out infinite 1s; }
      .pill-4 { animation: floatPill2 6.5s ease-in-out infinite 1.5s; }
      .telemetry-dot { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle class="pulse-bg-1" cx="240" cy="120" r="280" fill="url(#glow-cyan)" />
  <circle class="pulse-bg-2" cx="960" cy="280" r="300" fill="url(#glow-purple)" />

  <!-- Subtle Blueprint / Asset Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Telemetry & Vibration Wave Lines (Background Layer) -->
  <path class="flow-line" d="M -50 330 Q 150 290 350 330 T 750 320 T 1150 340 T 1300 310" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.45" />
  <path class="flow-line-fast" d="M -50 350 Q 200 380 450 340 T 850 360 T 1250 330" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.35" />

  <!-- Network / Topology Connection Nodes -->
  <g opacity="0.4">
    <circle class="telemetry-dot" cx="150" cy="90" r="4" fill="#38bdf8" />
    <line x1="150" y1="90" x2="280" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="280" cy="60" r="3" fill="#818cf8" />

    <circle class="telemetry-dot" cx="1050" cy="110" r="4" fill="#c084fc" />
    <line x1="1050" y1="110" x2="930" y2="80" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="930" cy="80" r="3" fill="#38bdf8" />
  </g>

  <!-- Foreground Title Card / Backdrop to guarantee 100% clarity & legibility -->
  <rect x="70" y="45" width="1060" height="230" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Foreground Badge / Pill on top of Title -->
  <g transform="translate(100, 72)">
    <rect width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="18" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Enterprise Asset Management
  </text>
  <text x="100" y="190" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800">
    (EAM) &amp; CMMS Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="100" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Enterprise SaaS Platforms • Sovereign Open-Source CMMS • Predictive Maintenance &amp; Reliability Engineering
  </text>

  <!-- Interactive Floating Status Pills (Foreground Row) -->
  <g class="pill-1" transform="translate(100, 305)">
    <rect width="220" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <text x="18" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">⚙️</text>
    <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Asset Lifecycle &amp; Work Orders</text>
  </g>

  <g class="pill-2" transform="translate(340, 305)">
    <rect width="230" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
    <text x="18" y="26" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">⚡</text>
    <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">IoT &amp; Predictive Maintenance</text>
  </g>

  <g class="pill-3" transform="translate(590, 305)">
    <rect width="240" height="42" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
    <text x="18" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">🛡️</text>
    <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Sovereign FOSS Alternatives</text>
  </g>

  <g class="pill-4" transform="translate(850, 305)">
    <rect width="250" height="42" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.95" />
    <text x="18" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">📊</text>
    <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Reliability &amp; RCM Standards</text>
  </g>
</svg>